version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --requirepass admin
    ports:
      - "6379:6379"
    restart: always
    networks:
      - app-network

  # Réplicas da Aplicação Next.js
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:admin@redis:6379
      - INTERNAL_API_URL=http://nextjs-app:3000
    deploy:
      replicas: 3
    depends_on:
      - redis
    networks:
      - app-network

  # Balanceador de Carga
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
